; =============================================================================
; SenseWeave Embedded Firmware Configuration — Target: ESP32-S3-N16R8
; =============================================================================
[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 Memory Configuration: 16MB Quad-SPI Flash (qio) + 8MB Octal PSRAM (opi)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Serial Monitor Configuration
monitor_speed = 115200

; Compiler Flags:
; -DBOARD_HAS_PSRAM enables the 8MB Octal PSRAM in the runtime
; -DARDUINO_USB_CDC_ON_BOOT=0 routes Serial to Hardware UART0 (GPIO43/44 right USB port)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9